<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="glass-container">
        <header>
            <h1 class="gradient-text">Link Shortener</h1>
            <p class="subtitle">Fast, secure, and beautiful.</p>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="shorten">Shorten</button>
            <button class="tab-btn" data-tab="analytics">Analytics</button>
        </nav>

        <!-- Shorten Section -->
        <section id="shorten" class="tab-content active">
            <form id="shortenForm">
                <div class="input-group">
                    <input type="url" id="urlInput" placeholder="Enter your long URL here..." required>
                </div>
                <button type="submit" class="primary-btn">
                    <span class="btn-text">Shorten Now</span>
                    <span class="loader hidden"></span>
                </button>
            </form>
            <div id="shortenResult" class="result-box hidden">
                <p>Your Shortened URL:</p>
                <div class="result-link-group">
                    <a href="#" id="shortenedLink" target="_blank"></a>
                    <button id="copyBtn" class="icon-btn" title="Copy to clipboard">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Analytics Section -->
        <section id="analytics" class="tab-content">
            <form id="analyticsForm">
                <div class="input-group">
                    <input type="text" id="shortIdInput" placeholder="Enter Short ID (e.g., iI9ttITg)" required>
                </div>
                <button type="submit" class="primary-btn">
                    <span class="btn-text">Get Insights</span>
                    <span class="loader hidden"></span>
                </button>
            </form>
            <div id="analyticsResult" class="result-box hidden">
                <div class="stat-card">
                    <h3>Total Clicks</h3>
                    <p id="totalClicks" class="stat-number gradient-text">0</p>
                </div>
                <div class="history-list-container">
                    <h3>Recent Visits</h3>
                    <ul id="visitHistoryList" class="history-list">
                        <!-- Items injected by JS -->
                    </ul>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
